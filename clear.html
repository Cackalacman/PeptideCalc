<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Clearing cache...</title>
<style>
body { background:#000; color:#5af0c4; font-family:monospace; display:flex; align-items:center; justify-content:center; min-height:100vh; flex-direction:column; gap:20px; }
h2 { color:#ffffff; }
</style>
</head>
<body>
<h2>Clearing old cache...</h2>
<p id="status">Working...</p>
<script>
async function clearAll() {
  const status = document.getElementById('status');
  
  // Unregister all service workers
  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    for (let reg of regs) {
      await reg.unregister();
    }
  }
  
  // Clear all caches
  if ('caches' in window) {
    const keys = await caches.keys();
    for (let key of keys) {
      await caches.delete(key);
    }
  }
  
  status.textContent = 'Done! Redirecting...';
  
  // Redirect to calculator after 1 second
  setTimeout(() => {
    window.location.href = 'https://peptideusa.github.io/PeptideCalc/index.html?v=' + Date.now();
  }, 1000);
}

clearAll();
</script>
</body>
</html>
